# Commander — the first first-class Format profile (spec #46, issue #53).
# A Format is data, never code (ADR 0005): deck-construction rules, check
# targets, banlist parameters, and judgment-flavored lists live here, read at
# Build start by generate_suite.py and snapshotted into each Deck's Suite.
# Changing a number here changes future Suites; it never touches the runner.

format: commander
display_name: Commander
centerpiece: required

profile:
  # Deck-construction rules and check targets. Only a Brief may override a
  # target — never silently: every override lands in the Suite under a
  # "brief:" provenance comment.
  deck_size: 100
  copy_limit_nonland: 1
  lands_min: 35
  lands_max: 40
  curve_avg_max: 3.5
  early_nonland_cmc2_min: 12
  # Consistency target, derived from the land window above so both checks can
  # green at once: exact hypergeometric P(>=2 lands in a 7-card hand | N=100,
  # K=35) = 0.7759, rounded DOWN to two decimals so the boundary land count
  # itself satisfies it. P rises with the land count (K=40 gives 0.8508), so
  # lands_min is the binding case and the whole window [35, 40] clears 0.77.
  p_2plus_lands_in_7_min: 0.77
  # Banlist parameter: which Oracle legalities key the legality.banlist Check
  # reads. Scryfall legality data is informational only.
  banlist_key: commander

quotas:
  # Default Role quotas over the global Role vocabulary (CONTEXT.md: ramp,
  # draw, removal, wipe, wincon, land, theme/other). A Brief ask ("at least
  # 12 ramp cards") overrides or adds a line; land is the lands_min/lands_max
  # target, not a quota.
  ramp: 10
  draw: 10
  removal: 8
  wipe: 2
  wincon: 2

game_changers_max_by_power:
  # Per-bracket Game Changers limits, Power read as the official WotC Bracket
  # (1 Exhibition ... 5 cEDH). The legality.game_changers Check reads the
  # Oracle's game_changer flag; unlimited generates no Check at all.
  1: 0
  2: 0
  3: 3
  4: unlimited
  5: unlimited

role_guidance:
  # Judgment-flavored list (ADR 0005): how Commander reads each global Role
  # when Build tags a card. Tagging is judgment recorded once per card in the
  # Suite's roles: section; counting the tags is mechanical. A card may carry
  # several Roles and counts toward each.
  ramp: Accelerates mana - rocks, dorks, extra-land effects, cost reducers.
  draw: Refills the hand - repeatable engines count over one-shot cantrips.
  removal: Answers a threat - targeted destruction, exile, bounce, counters.
  wipe: Resets the board - mass destruction or mass bounce.
  wincon: Closes the game - a card the Deck actually wins through.
  land: Any card with the Land type.
  theme: Advances the Brief's named theme; other covers honest glue.

checks:
  # Check templates whose ids resolve to the runner's fixed predicates, in
  # report order. generate_suite.py inserts quota Checks and mechanical Brief
  # Checks before the consistency Check, and drops the Game Changers Check
  # when the bracket sets no limit.
  - id: legality.size
    text: Deck has exactly {deck_size} cards, commander included.
  - id: legality.singleton
    text: No nonland card appears more than {copy_limit_nonland} time(s).
  - id: legality.color_identity
    text: Every card stays inside the commander's color identity ({color_identity}).
  - id: legality.banlist
    text: Every card is legal in {banlist_key} per the Oracle.
  - id: legality.game_changers
    text: At most {game_changers_max} Game Changers for this bracket.
  - id: legality.land_count
    text: Between {lands_min} and {lands_max} lands.
  - id: availability.in_collection
    text: Every card (at its count) exists in the Collection.
  - id: manabase.color_coverage
    text: Lands can produce every color the spells ask for.
  - id: curve.average
    text: Average nonland mana value is at most {curve_avg_max}.
  - id: curve.early_plays
    text: At least {early_nonland_cmc2_min} nonland cards at mana value 2 or less.
  - id: consistency.opening_lands
    text: P(at least 2 lands in a 7-card opening hand) is at least {p_2plus_lands_in_7_min}.
