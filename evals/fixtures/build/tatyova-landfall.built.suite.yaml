# Suite Block — generated at Build start from the Brief and the Format profile,
# before any card is picked (ADR 0005). Data only: targets are snapshotted,
# judgment lands as data, the fixed runner interprets. Re-running the Suite
# (including at Upgrade) reuses this file as-is; only a changed Brief
# regenerates it.

suite: Tatyova Landfall
format: Commander
generated: 2026-08-18
brief: commander — Tatyova, Benthic Druid — power 2

profile:
  # Format-profile targets snapshotted at generation. Lines under a "brief:"
  # comment were set or overridden by the Brief — the only voice allowed to.
  deck_size: 100
  copy_limit_nonland: 1
  lands_min: 35
  lands_max: 40
  curve_avg_max: 3.5
  early_nonland_cmc2_min: 12
  p_2plus_lands_in_7_min: 0.77
  banlist_key: commander
  # brief: centerpiece: Tatyova, Benthic Druid — color identity from the Oracle
  color_identity: [G, U]
  # brief: power: 2 — bracket allows 0 Game Changers
  game_changers_max: 0

quotas:
  # Role quotas over the global Role vocabulary. One Check per line.
  ramp: 10
  draw: 10
  removal: 8
  wipe: 2
  wincon: 2

constraints:
  # Mechanical Brief constraints (judgment-free), one Check each.
  # brief: constraint: nothing above 6 mana
  cmc_max: 6
  donors:
    # brief: donor: Baylen, the Haymaker
    - Baylen, the Haymaker
    # brief: donor: Tatyova, Benthic Druid
    - Tatyova, Benthic Druid
  must_include:
    # brief: centerpiece: Tatyova, Benthic Druid
    - Tatyova, Benthic Druid

