checks:
  # The Suite: every id resolves to a fixed predicate in the runner (or a
  # walkable sentence when no sandbox exists); every parameter lives above.
  - id: legality.size
    text: Deck has exactly {deck_size} cards, commander included.
  - id: legality.singleton
    text: No nonland card appears more than {copy_limit_nonland} time(s).
  - id: legality.color_identity
    text: Every card stays inside the commander's color identity ({color_identity}).
  - id: legality.banlist
    text: Every card is legal in {banlist_key} per the Oracle.
  - id: legality.game_changers
    text: At most {game_changers_max} Game Changers for this bracket.
  - id: legality.land_count
    text: Between {lands_min} and {lands_max} lands.
  - id: availability.in_collection
    text: Every card (at its count) exists in the Collection.
  - id: manabase.color_coverage
    text: Lands can produce every color the spells ask for.
  - id: curve.average
    text: Average nonland mana value is at most {curve_avg_max}.
  - id: curve.early_plays
    text: At least {early_nonland_cmc2_min} nonland cards at mana value 2 or less.
  - id: quota.ramp
    text: At least {quotas.ramp} cards tagged ramp.
  - id: quota.draw
    text: At least {quotas.draw} cards tagged draw.
  - id: quota.removal
    text: At least {quotas.removal} cards tagged removal.
  - id: quota.wipe
    text: At least {quotas.wipe} cards tagged wipe.
  - id: quota.wincon
    text: At least {quotas.wincon} cards tagged wincon.
  - id: brief.cmc_max
    text: No card above mana value {cmc_max}.
  - id: brief.includes
    text: The Deck contains every must-include card ({must_include}).
  - id: consistency.opening_lands
    text: P(at least 2 lands in a 7-card opening hand) is at least {p_2plus_lands_in_7_min}.
