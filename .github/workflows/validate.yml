name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Plugin validator (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Validates the marketplace manifest and, through its single entry,
      # the plugin manifest at the repo root.
      - name: Validate marketplace and plugin manifests (strict)
        run: claude plugin validate . --strict

      - name: Validate skills (strict)
        run: claude plugin validate skills --strict

      - name: Validate commands (strict)
        run: claude plugin validate commands --strict

      # Release-flow behaviour tests: each test releases a fixture copy of
      # this repo against a local bare remote, so nothing leaves the runner.
      - name: Release flow tests
        run: tests/release.test.sh

  suite-runner:
    name: Suite runner offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner is stdlib-only by contract (ADR 0005): no installs, no
      # network — the fixture Suite and the prototype's captured runs are
      # committed under tests/.
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
